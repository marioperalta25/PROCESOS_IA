[estilo]
hoja = """
QWidget#chat_local { background: #F4F0E8; }
QWidget#historial_chat, QWidget#historial_chat QLabel { background: #24352F; color: #F4F0E8; }
QListWidget#lista_chats { background: #24352F; color: #F4F0E8; border: none; }
QListWidget#lista_chats::item { padding: 12px 8px; }
QListWidget#lista_chats::item:selected { background: #3A5044; color: #FFFCF7; border-left: 3px solid #D4AC7D; }
QPlainTextEdit#transcripcion_chat { background: #FFFCF7; border: none; padding: 12px; font-size: 11pt; }
QLabel#titulo_chat { font-size: 17pt; font-weight: 600; }
QScrollArea#mensajes_chat, QWidget#lienzo_mensajes, QWidget#fila_mensaje { background: #FFFCF7; border: none; }
QFrame#burbuja_usuario, QFrame#burbuja_usuario QLabel, QFrame#burbuja_usuario QTextEdit { background: #DCE7DE; color: #213C31; border: none; }
QFrame#burbuja_asistente, QFrame#burbuja_asistente QLabel, QFrame#burbuja_asistente QTextEdit { background: #EEE5D6; color: #3C352A; border: none; }
QFrame#burbuja_usuario, QFrame#burbuja_asistente { border-radius: 12px; }
QTextEdit#texto_mensaje { padding: 0; margin: 0; border: none; }
QLabel#autor_mensaje { font-weight: 600; }
QPushButton#recordar_mensaje { background: transparent; color: #8A402A; border: none; padding: 2px 4px; font-size: 9pt; }
QPushButton#recordar_mensaje:disabled { color: #83796E; }
"""
